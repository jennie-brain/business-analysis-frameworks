<svg viewBox="0 0 760 740" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="760" height="740" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">AOS 매트릭스 — 36개 Pain (Satisfaction × Importance, 3점 분할선)</text>

  <!-- quadrant background blocks (경계: Sat=3, Imp=3) -->
  <rect x="110" y="70" width="300" height="280" fill="#BBDEFB"/>
  <rect x="410" y="70" width="300" height="280" fill="#C8E6C9"/>
  <rect x="110" y="350" width="300" height="280" fill="#EEEEEE"/>
  <rect x="410" y="350" width="300" height="280" fill="#FFE0B2"/>

  <!-- 눈금 보조선(흰색) -->
  <line x1="260" y1="70" x2="260" y2="630" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="560" y1="70" x2="560" y2="630" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="110" y1="210" x2="710" y2="210" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="110" y1="490" x2="710" y2="490" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 3점 분할선(굵게) -->
  <line x1="410" y1="60" x2="410" y2="640" stroke="#333333" stroke-width="3"/>
  <line x1="100" y1="350" x2="720" y2="350" stroke="#333333" stroke-width="3"/>

  <!-- 외곽 테두리 -->
  <rect x="110" y="70" width="600" height="560" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- 사분면 라벨 -->
  <text x="260" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Q1 혁신기회 16건</text>
  <text x="560" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Q2 개선기회 6건</text>
  <text x="260" y="646" text-anchor="middle" font-size="13" font-weight="bold" fill="#616161">Q3 유지관리 2건</text>
  <text x="560" y="646" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Q4 과잉투자 12건</text>

  <!-- X축 눈금(Satisfaction 1~5), 3은 강조 -->
  <text x="110" y="665" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="260" y="665" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="410" y="665" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">3</text>
  <text x="560" y="665" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="710" y="665" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="410" y="688" text-anchor="middle" font-size="13" fill="#333">Satisfaction(충족도) — 3점 기준 Low/High 분할</text>

  <!-- Y축 눈금(Importance 1~5), 3은 강조 -->
  <text x="95" y="634" text-anchor="end" font-size="12" fill="#333">1</text>
  <text x="95" y="494" text-anchor="end" font-size="12" fill="#333">2</text>
  <text x="95" y="354" text-anchor="end" font-size="14" font-weight="bold" fill="#C62828">3</text>
  <text x="95" y="214" text-anchor="end" font-size="12" fill="#333">4</text>
  <text x="95" y="74" text-anchor="end" font-size="12" fill="#333">5</text>
  <text x="20" y="350" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 20 350)">Importance(중요도) — 3점 기준 Low/High 분할</text>

  <!-- ===== 점 1: (Sat1,Imp3) 2건 ===== -->
  <circle cx="110" cy="346" r="8" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="110" y="350" text-anchor="middle" font-size="10" fill="#ffffff">2</text>
  <text x="126" y="343.5" font-size="11" fill="#2E7D32">A1-4</text>
  <text x="126" y="356.5" font-size="11" fill="#2E7D32">A3-5</text>

  <!-- ===== 점 2: (Sat1,Imp5) 2건 ===== -->
  <circle cx="110" cy="70" r="8" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="110" y="74" text-anchor="middle" font-size="10" fill="#ffffff">2</text>
  <text x="126" y="67.5" font-size="11" font-weight="bold" fill="#C62828">E1-2★</text>
  <text x="126" y="80.5" font-size="11" fill="#C62828">E2-2</text>

  <!-- ===== 점 3: (Sat2,Imp2) 2건 ===== -->
  <circle cx="260" cy="490" r="8" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260" y="494" text-anchor="middle" font-size="10" fill="#ffffff">2</text>
  <text x="276" y="487.5" font-size="11" fill="#2E7D32">A1-5</text>
  <text x="276" y="500.5" font-size="11" fill="#555555">N2-5</text>

  <!-- ===== 점 4: (Sat2,Imp3) 3건 ===== -->
  <circle cx="260" cy="346" r="9.5" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#ffffff">3</text>
  <text x="277" y="337" font-size="11" font-weight="bold" fill="#2E7D32">A2-4★</text>
  <text x="277" y="350" font-size="11" fill="#2E7D32">A3-4</text>
  <text x="277" y="363" font-size="11" fill="#C62828">E2-3</text>

  <!-- ===== 점 5: (Sat2,Imp4) 7건 ===== -->
  <circle cx="260" cy="210" r="15.5" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260" y="214" text-anchor="middle" font-size="10" fill="#ffffff">7</text>
  <text x="283" y="175" font-size="11" fill="#1565C0">C2-1</text>
  <text x="283" y="188" font-size="11" fill="#1565C0">C4-1</text>
  <text x="283" y="201" font-size="11" fill="#1565C0">C5-1</text>
  <text x="283" y="214" font-size="11" font-weight="bold" fill="#2E7D32">A2-2★</text>
  <text x="283" y="227" font-size="11" fill="#2E7D32">A1-2</text>
  <text x="283" y="240" font-size="11" fill="#2E7D32">A3-2</text>
  <text x="283" y="253" font-size="11" fill="#555555">N2-3</text>

  <!-- ===== 점 6: (Sat2,Imp5) 2건 ===== -->
  <circle cx="260" cy="70" r="8" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260" y="74" text-anchor="middle" font-size="10" fill="#ffffff">2</text>
  <text x="276" y="67.5" font-size="11" font-weight="bold" fill="#1565C0">C1-1★</text>
  <text x="276" y="80.5" font-size="11" fill="#1565C0">C3-1</text>

  <!-- ===== 점 7: (Sat3,Imp2) 6건 — Sat3은 경계선상, High쪽으로 살짝 이동해 표기 ===== -->
  <circle cx="414" cy="490" r="14" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="414" y="494" text-anchor="middle" font-size="10" fill="#ffffff">6</text>
  <text x="432" y="461.5" font-size="11" fill="#1565C0">C2-5</text>
  <text x="432" y="474.5" font-size="11" fill="#1565C0">C4-5</text>
  <text x="432" y="487.5" font-size="11" fill="#1565C0">C5-5</text>
  <text x="432" y="500.5" font-size="11" font-weight="bold" fill="#C62828">E1-6★</text>
  <text x="432" y="513.5" font-size="11" fill="#C62828">E2-5</text>
  <text x="432" y="526.5" font-size="11" fill="#555555">N2-1</text>

  <!-- ===== 점 8: (Sat3,Imp3) 5건 — 두 축 모두 경계선상, High쪽으로 살짝 이동 ===== -->
  <circle cx="414" cy="346" r="12.5" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="414" y="350" text-anchor="middle" font-size="10" fill="#ffffff">5</text>
  <text x="431" y="324" font-size="11" font-weight="bold" fill="#1565C0">C1-5★</text>
  <text x="431" y="337" font-size="11" fill="#1565C0">C3-5</text>
  <text x="431" y="350" font-size="11" fill="#1565C0">C4-4</text>
  <text x="431" y="363" font-size="11" fill="#1565C0">C5-4</text>
  <text x="431" y="376" font-size="11" font-weight="bold" fill="#2E7D32">A2-1★</text>

  <!-- ===== 점 9: (Sat4,Imp2) 5건 ===== -->
  <circle cx="560" cy="490" r="12.5" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="560" y="494" text-anchor="middle" font-size="10" fill="#ffffff">5</text>
  <text x="577" y="468" font-size="11" font-weight="bold" fill="#1565C0">C1-6★</text>
  <text x="577" y="481" font-size="11" font-weight="bold" fill="#C62828">E1-5★</text>
  <text x="577" y="494" font-size="11" font-weight="bold" fill="#555555">N1-3★</text>
  <text x="577" y="507" font-size="11" fill="#1565C0">C2-4</text>
  <text x="577" y="520" font-size="11" fill="#1565C0">C3-6</text>

  <!-- ===== 점 10: (Sat5,Imp1) 1건 ===== -->
  <circle cx="710" cy="630" r="6.5" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="694" y="634" text-anchor="end" font-size="11" font-weight="bold" fill="#555555">N1-1★</text>

  <!-- ===== 점 11: (Sat5,Imp3) 1건 — Imp3 경계선상, High쪽으로 살짝 이동 ===== -->
  <circle cx="710" cy="346" r="6.5" fill="#37474F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="694" y="350" text-anchor="end" font-size="11" font-weight="bold" fill="#555555">N1-4★</text>

  <!-- 범례 -->
  <text x="380" y="712" text-anchor="middle" font-size="11" fill="#555">C=Core · A=Adjacent · E=Extreme · N=Non-user · ★=05챕터 대표 4명 · 짙은 점=동일 좌표에 겹치는 건수(숫자)</text>
  <text x="380" y="728" text-anchor="middle" font-size="11" fill="#555">경계값(3점)은 분류상 High에 포함돼, 점 위치를 경계선에서 자기 쪽 사분면으로 살짝 이동해 표시</text>
</svg>
