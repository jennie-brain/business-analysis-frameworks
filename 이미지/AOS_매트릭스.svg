  <circle cx="234" cy="86" r="3.5" fill="#1565C0"/>
  <text x="244" y="90" font-size="11" font-weight="bold" fill="#1565C0">C1-1★</text>
  <circle cx="234" cy="100" r="3.5" fill="#1565C0"/>
  <text x="244" y="104" font-size="11" fill="#1565C0">C3-1</text>

