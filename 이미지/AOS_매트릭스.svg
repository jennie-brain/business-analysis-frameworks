  <circle cx="234" cy="196" r="3.5" fill="#1565C0"/>
  <text x="244" y="200" font-size="11" fill="#1565C0">C2-1</text>
  <circle cx="234" cy="210" r="3.5" fill="#1565C0"/>
  <text x="244" y="214" font-size="11" fill="#1565C0">C4-1</text>
  <circle cx="234" cy="224" r="3.5" fill="#1565C0"/>
  <text x="244" y="228" font-size="11" fill="#1565C0">C5-1</text>
  <circle cx="234" cy="238" r="3.5" fill="#2E7D32"/>
  <text x="244" y="242" font-size="11" font-weight="bold" fill="#2E7D32">A2-2★</text>
  <circle cx="234" cy="252" r="3.5" fill="#2E7D32"/>
  <text x="244" y="256" font-size="11" fill="#2E7D32">A1-2</text>
  <circle cx="234" cy="266" r="3.5" fill="#2E7D32"/>
  <text x="244" y="270" font-size="11" fill="#2E7D32">A3-2</text>
  <circle cx="234" cy="280" r="3.5" fill="#555555"/>
  <text x="244" y="284" font-size="11" fill="#555555">N2-3</text>

