  <circle cx="354" cy="416" r="3.5" fill="#1565C0"/>
  <text x="364" y="420" font-size="11" fill="#1565C0">C2-5</text>
  <circle cx="354" cy="430" r="3.5" fill="#1565C0"/>
  <text x="364" y="434" font-size="11" fill="#1565C0">C4-5</text>
  <circle cx="354" cy="444" r="3.5" fill="#1565C0"/>
  <text x="364" y="448" font-size="11" fill="#1565C0">C5-5</text>
  <circle cx="354" cy="458" r="3.5" fill="#C62828"/>
  <text x="364" y="462" font-size="11" font-weight="bold" fill="#C62828">E1-6★</text>
  <circle cx="354" cy="472" r="3.5" fill="#C62828"/>
  <text x="364" y="476" font-size="11" fill="#C62828">E2-5</text>
  <circle cx="354" cy="486" r="3.5" fill="#555555"/>
  <text x="364" y="490" font-size="11" fill="#555555">N2-1</text>

  <!-- ===== 셀 (Sat3, Imp3): C1-5★,C3-5,C4-4,C5-4,A2-1★ ===== -->
  <circle cx="354" cy="306" r="3.5" fill="#1565C0"/>
  <text x="364" y="310" font-size="11" font-weight="bold" fill="#1565C0">C1-5★</text>
  <circle cx="354" cy="320" r="3.5" fill="#1565C0"/>
  <text x="364" y="324" font-size="11" fill="#1565C0">C3-5</text>
  <circle cx="354" cy="334" r="3.5" fill="#1565C0"/>
  <text x="364" y="338" font-size="11" fill="#1565C0">C4-4</text>
  <circle cx="354" cy="348" r="3.5" fill="#1565C0"/>
  <text x="364" y="352" font-size="11" fill="#1565C0">C5-4</text>
  <circle cx="354" cy="362" r="3.5" fill="#2E7D32"/>
  <text x="364" y="366" font-size="11" font-weight="bold" fill="#2E7D32">A2-1★</text>

  <!-- ===== 셀 (Sat4, Imp2): C1-6★,C2-4,C3-6,E1-5★,N1-3★ ===== -->
  <circle cx="474" cy="416" r="3.5" fill="#1565C0"/>
  <text x="484" y="420" font-size="11" font-weight="bold" fill="#1565C0">C1-6★</text>
  <circle cx="474" cy="430" r="3.5" fill="#1565C0"/>
  <text x="484" y="434" font-size="11" fill="#1565C0">C2-4</text>
  <circle cx="474" cy="444" r="3.5" fill="#1565C0"/>
  <text x="484" y="448" font-size="11" fill="#1565C0">C3-6</text>
  <circle cx="474" cy="458" r="3.5" fill="#C62828"/>
  <text x="484" y="462" font-size="11" font-weight="bold" fill="#C62828">E1-5★</text>
  <circle cx="474" cy="472" r="3.5" fill="#555555"/>
  <text x="484" y="476" font-size="11" font-weight="bold" fill="#555555">N1-3★</text>

  <!-- ===== 셀 (Sat5, Imp1): N1-1★ ===== -->
  <circle cx="594" cy="546" r="3.5" fill="#555555"/>
  <text x="604" y="550" font-size="11" font-weight="bold" fill="#555555">N1-1★</text>

  <!-- ===== 셀 (Sat5, Imp3): N1-4★ ===== -->
  <circle cx="594" cy="306" r="3.5" fill="#555555"/>
  <text x="604" y="310" font-size="11" font-weight="bold" fill="#555555">N1-4★</text>

  <!-- legend -->
  <text x="400" y="712" text-anchor="middle" font-size="11" fill="#555">C=Core · A=Adjacent · E=Extreme · N=Non-user · ★=05챕터 대표 4명(C1·A2·E1·N1)</text>
</svg>
