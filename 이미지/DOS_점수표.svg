  <line x1="280" y1="375" x2="280" y2="855" stroke="#cccccc" stroke-width="1"/>
  <line x1="405" y1="375" x2="405" y2="855" stroke="#eeeeee" stroke-width="1"/>
  <line x1="530" y1="375" x2="530" y2="855" stroke="#eeeeee" stroke-width="1"/>
