<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="900" fill="#ffffff"/>

  <!-- ===================== Panel A: Market Relevance SOM vs SAM ===================== -->
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">A. 그룹별 Market Relevance — SOM 버전 vs SAM 버전</text>

  <!-- 그룹1: 수출 -->
  <text x="210" y="68" text-anchor="end" font-size="12" fill="#333">수출</text>
  <rect x="220" y="55" width="325" height="16" fill="#1565C0"/>
  <text x="550" y="67" font-size="11" fill="#333">SOM 0.65</text>
  <rect x="220" y="75" width="75" height="16" fill="#1565C0" opacity="0.45"/>
  <text x="300" y="87" font-size="11" fill="#333">SAM 0.15</text>

  <!-- 그룹2: 수입 -->
  <text x="210" y="116" text-anchor="end" font-size="12" fill="#333">수입</text>
  <rect x="220" y="103" width="175" height="16" fill="#6A1B9A"/>
  <text x="400" y="115" font-size="11" fill="#333">SOM 0.35</text>
  <rect x="220" y="123" width="40" height="16" fill="#6A1B9A" opacity="0.45"/>
  <text x="265" y="135" font-size="11" fill="#333">SAM 0.08</text>

  <!-- 그룹3: 겸업 -->
  <text x="210" y="164" text-anchor="end" font-size="12" fill="#333">겸업</text>
  <rect x="220" y="151" width="500" height="16" fill="#00838F"/>
  <text x="725" y="163" font-size="11" fill="#333">SOM 1.0</text>
  <rect x="220" y="171" width="115" height="16" fill="#00838F" opacity="0.45"/>
  <text x="340" y="183" font-size="11" fill="#333">SAM 0.23</text>

  <!-- 그룹4: Adjacent -->
  <text x="210" y="212" text-anchor="end" font-size="12" fill="#333">Adjacent</text>
  <rect x="220" y="199" width="100" height="16" fill="#2E7D32"/>
  <text x="325" y="211" font-size="11" fill="#333">SOM 0.2</text>
  <rect x="220" y="219" width="75" height="16" fill="#2E7D32" opacity="0.45"/>
  <text x="300" y="231" font-size="11" fill="#333">SAM 0.15</text>

  <!-- 그룹5: 대기업 -->
  <text x="210" y="260" text-anchor="end" font-size="12" fill="#333">대기업</text>
  <rect x="220" y="247" width="50" height="16" fill="#757575"/>
  <text x="275" y="259" font-size="11" fill="#333">SOM 0.1</text>
  <rect x="220" y="267" width="145" height="16" fill="#757575" opacity="0.45"/>
  <text x="370" y="279" font-size="11" fill="#333">SAM 0.29 ← 반전</text>

  <line x1="220" y1="295" x2="720" y2="295" stroke="#cccccc" stroke-width="1"/>
  <text x="220" y="310" font-size="11" fill="#555">■ 진한 막대 = SOM 버전(3,123억 기준)　▨ 연한 막대 = SAM 버전(1.34조 기준)</text>

  <line x1="0" y1="330" x2="900" y2="330" stroke="#e0e0e0" stroke-width="2"/>

  <!-- ===================== Panel B: SOM 버전 DOS 양수 구간 16개 ===================== -->
  <text x="450" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">B. SOM 버전 DOS 양수 구간 전체(16개, 내림차순)</text>

