  <text x="335" y="725" font-size="11" font-weight="bold" fill="#2E7D32">0.4</text>
  <!-- 13 -->
  <text x="275" y="752" text-anchor="end" font-size="11" fill="#333">A3-② 한도윤</text>
  <rect x="280" y="740" width="50" height="20" fill="#2E7D32"/>
  <text x="335" y="755" font-size="11" font-weight="bold" fill="#2E7D32">0.4</text>
  <!-- 14 -->
  <text x="275" y="782" text-anchor="end" font-size="11" fill="#333">A3-⑤ 한도윤</text>
  <rect x="280" y="770" width="50" height="20" fill="#2E7D32"/>
