  <text x="450" y="885" text-anchor="middle" font-size="11" fill="#555">■ 수출(파랑) · 수입(보라) · 겸업(청록) · Adjacent(초록) — 대기업 그룹은 이 구간에 없음(전부 DOS 음수)</text>
