  <text x="130" y="68" font-size="13" fill="#475569">중견 수출입기업 자금팀장 — 문제를 제기하는 내부 스폰서(단독 결정권자 아님)</text>
  <text x="130" y="88" font-size="13" fill="#475569">월말·분기말 동시 마감 시 컷오프에 밀려 실패를 반복 경험(예시값)</text>
