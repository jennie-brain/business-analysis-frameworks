  <polygon points="1365,370 1385,370 1375,385" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1375" y="332" font-size="13" font-style="italic" fill="#1e293b" text-anchor="middle">"예외 줄면</text>
  <text x="1375" y="350" font-size="13" font-style="italic" fill="#1e293b" text-anchor="middle">계속 쓸 만하다"</text>

