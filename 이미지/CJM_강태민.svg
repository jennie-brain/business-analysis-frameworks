  <text x="875" y="470" font-size="13" font-style="italic" fill="#1e293b" text-anchor="middle">게 다르네"</text>

  <rect x="1030" y="305" width="190" height="65" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="1115,370 1135,370 1125,385" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
